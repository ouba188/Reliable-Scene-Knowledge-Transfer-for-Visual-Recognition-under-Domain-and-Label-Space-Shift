caveats:
- 'facility_temporal_valid compares OSM last-edit time with the scene date: not construction
  time.'
- distances cap at 2000 m; a capped value is not evidence that the layer exists 2
  km away.
- channel_angle_deg falls back to an AIS-derived field; P0 must split on channel_angle_source.
- local density / nearest neighbour / heading stats were computed before tile and
  polarisation dedup.
- support_i mixes AIS signals and must not gate target candidates.
